<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM - Under Maintenance</title>
  
  <!-- Google Fonts: Rajdhani & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: #0f172a;
      --accent-gold: #f59e0b;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      background-image: 
        radial-gradient(circle at 50% 0%, #172554 0%, transparent 60%),
        radial-gradient(circle at 10% 40%, rgba(30, 58, 138, 0.2) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* NAVBAR */
    .navbar {
      background: rgba(7, 11, 20, 0.95);
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .main-logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      object-fit: cover;
      background: #0f172a;
      display: block;
    }

    .brand-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .brand-text span {
      color: var(--accent-gold);
    }

    /* MAINTENANCE CONSOLE */
    .maintenance-container {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      width: 100%;
    }

    .maintenance-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 25px rgba(245, 158, 11, 0.15);
    }

    .maintenance-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .maintenance-card h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      margin-bottom: 12px;
    }

    .maintenance-card p {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-whatsapp {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
      transform: translateY(-2px);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid var(--border);
      background: rgba(7, 11, 20, 0.95);
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="brand-wrap">
      <img src="logo.jpeg" alt="Team Phantom Logo" class="main-logo" onerror="this.src='https://via.placeholder.com/50/f59e0b/000000?text=TP'" />
      <div class="brand-text">Team <span>Phantom</span></div>
    </div>
  </header>

  <!-- MAINTENANCE SECTION -->
  <main class="maintenance-container">
    <div class="maintenance-card">
      <div class="maintenance-icon">🛠️</div>
      <h1>System Maintenance</h1>
      <p>
        Website maintenance ke liye band hai. Jaise hi website chalu hogi, aapko official WhatsApp channel par update mil jayega.
      </p>
      <a href="https://whatsapp.com/channel/0029VbCKwhBIXnlwyy2xyb3a" target="_blank" class="btn-whatsapp">
        Click Here to Join WhatsApp Channel
      </a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    TEAM PHANTOM &bull; DISCIPLINE &bull; VICTORY &bull; &copy; 2026
  </footer>

</body>
</html>
